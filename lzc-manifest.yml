application:
  subdomain: plausible
  multi_instance: false
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://plausible:8000/

services:
  db:
    image: docker.1ms.run/library/postgres:16-alpine
    environment:
      - POSTGRES_DB=plausible_db
      - POSTGRES_USER=plausible
      - |-
        POSTGRES_PASSWORD={{ stable_secret "plausible_db_password" | replace "\r" "" | replace "\n" "" }}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U plausible -d plausible_db
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    binds:
      - /lzcapp/var/pgdata:/var/lib/postgresql/data

  # Plausible 2.x+ stores events in ClickHouse; it is not optional.
  # ClickHouse needs SSE 4.2 on amd64 and roughly 2 GB RAM overall.
  events_db:
    image: docker.1ms.run/clickhouse/clickhouse-server:24.12-alpine
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    # Docker bridge networks have no IPv6 by default; without this ClickHouse
    # logs "Listen [::]:9000 failed: Address family not supported".
    command:
      - --listen_host=0.0.0.0
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    binds:
      - /lzcapp/var/clickhouse:/var/lib/clickhouse

  plausible:
    # upstream: ghcr.io/plausible/community-edition:v3.2.1
    image: ghcr.1ms.run/plausible/community-edition:v3.2.1
    depends_on:
      - db
      - events_db
    # The image has no default command that creates the schema, so the three
    # steps must be chained here or the app starts against empty databases.
    command:
      - sh
      - -c
      - /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run
    environment:
      - |-
        BASE_URL=https://{{ .S.AppDomain }}
      - |-
        SECRET_KEY_BASE={{ stable_secret "plausible_secret_key_base" | replace "\r" "" | replace "\n" "" }}
      - |-
        DATABASE_URL=postgres://plausible:{{ stable_secret "plausible_db_password" | replace "\r" "" | replace "\n" "" }}@db:5432/plausible_db
      - CLICKHOUSE_DATABASE_URL=http://events_db:8123/plausible_events
      - HTTP_PORT=8000
      # Signup must stay open for the first visit (that is how the first admin
      # is created); it can be closed later from the UI.
      - DISABLE_REGISTRATION=false
      - ENABLE_EMAIL_VERIFICATION=false
      - TMPDIR=/var/lib/plausible/tmp
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/plausible:/var/lib/plausible

usage: |
  Plausible 是注重隐私的网站统计工具，Google Analytics 的轻量替代品。

  使用方法：
  1. 打开应用，**首次访问会自动跳到注册页**，在这里创建第一个账号（即管理员）。
     密码自己设，包内没有内置口令。
  2. 登录后点"添加网站"，填你的域名。系统会给你一段 tracking script。
  3. 把脚本贴到网站页面的 <head> 里（Google Tag Manager 也可以）。
  4. 之后在 Plausible 就能看到访客量、来源、热门页面和设备分布，不用 cookie。

  数据与安全：
  - 账号与站点配置存在 PostgreSQL（/lzcapp/var/pgdata），
    访问事件存在 ClickHouse（/lzcapp/var/clickhouse），
    临时文件与缓存存在 /lzcapp/var/plausible。卸载应用会一并删除，请定期备份。
  - 管理员由你首次注册时创建，不存在内置弱口令。
  - SECRET_KEY_BASE 与数据库密码由平台稳定密钥生成，每个部署不同；
    请勿改动这些值，否则已加密的数据将无法读取。
  - 应用经懒猫入口鉴权访问。

  说明：
  - 三个容器：Plausible + PostgreSQL 16 + ClickHouse 24.12。
    ClickHouse 需要 CPU 支持 SSE 4.2，且整体建议 2GB 以上可用内存。
  - 首次启动会自动建库并执行数据库迁移（createdb → migrate → run），
    因此第一次打开可能需要等一两分钟。
  - 未配置邮件服务，因此关闭了邮箱验证；邮件报表与找回密码不可用。
  - 注册保持开放以便创建首个账号，建成后可在后台自行邀请成员。
  - 未做真机验证：注册、添加站点、上报访问以及重启后持久化均未在设备上实测。
